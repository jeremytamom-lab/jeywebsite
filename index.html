<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jeremy Tamom</title>
  <link rel="apple-touch-icon" sizes="180x180" href="src/assets/images/favicon_io/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="src/assets/images/favicon_io/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="src/assets/images/favicon_io/favicon-16x16.png" />
  <link rel="manifest" href="src/assets/images/favicon_io/site.webmanifest" />
  <link rel="stylesheet" href="src/styles/main.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
</head>
<body>

  <header id="site-header"></header>

  <!-- ── OUVERTURE / HERO ────────────────────── -->
  <section class="hero">
    <div class="hero-inner">
      <div class="hero-photo">
        <img src="src/assets/images/divers/02.jpg" alt="" fetchpriority="high" />
        <p class="caption">Entropology - 2023</p>
      </div>
    </div>
  </section>

  <main class="gallery">

    <!-- ── WEYZ x FACE CACHÉE ───────────────── -->
    <section class="series">

      <div class="series-row" style="justify-content: flex-start">
        <div class="photo-item" style="flex: 0 0 21%">
          <img loading="lazy" decoding="async" src="src/assets/images/weyz/01.jpg" alt="" />
          <p class="caption">Weyz x Face Cachée Studio - 2025</p>
        </div>
        <div class="photo-item" style="flex: 0 0 21%">
          <img loading="lazy" decoding="async" src="src/assets/images/weyz/02.jpg" alt="" />
        </div>
        <div class="photo-item" style="flex: 0 0 21%">
          <img loading="lazy" decoding="async" src="src/assets/images/weyz/03.jpg" alt="" />
        </div>
      </div>

      <div class="series-row" style="justify-content: flex-end">
        <div class="photo-item" style="flex: 0 0 21%">
          <img loading="lazy" decoding="async" src="src/assets/images/weyz/04.jpg" alt="" />
        </div>
        <div class="photo-item" style="flex: 0 0 21%">
          <img loading="lazy" decoding="async" src="src/assets/images/weyz/05.jpg" alt="" />
        </div>
      </div>

    </section>

    <!-- ── XVBARBAR ──────────────────────────── -->
    <section class="series">

      <div class="series-row" style="justify-content: flex-start; padding-left: 15%">
        <div class="photo-item video-item" style="flex: 0 0 30%">
          <div class="video-wrap">
            <video autoplay muted loop playsinline>
              <source src="src/assets/videos/xvbarbar.mp4" type="video/mp4" />
            </video>
            <button class="sound-btn" aria-label="Toggle sound">
              <svg class="icon-muted" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
              <svg class="icon-sound" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
            </button>
          </div>
          <p class="caption">Xvbarbar — Olympia - 2026</p>
        </div>
      </div>

      <div class="series-row" style="justify-content: flex-end; margin-top: -60px">
        <div class="photo-item video-item" style="flex: 0 0 25%">
          <div class="video-wrap">
            <video autoplay muted loop playsinline>
              <source src="src/assets/videos/th_olympia.mp4" type="video/mp4" />
            </video>
            <button class="sound-btn" aria-label="Toggle sound">
              <svg class="icon-muted" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
              <svg class="icon-sound" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
            </button>
          </div>
          <p class="caption">Th — Olympia - 2026</p>
        </div>
      </div>

    </section>

    <!-- ── BALNIA ────────────────────────────── -->
    <section class="series">

      <div class="series-row">
        <div class="photo-item" style="flex: 0 0 28%">
          <img loading="lazy" decoding="async" src="src/assets/images/balnia/01.jpg" alt="" />
          <p class="caption">Balna - 2025</p>
        </div>
        <div class="photo-item" style="flex: 0 0 21%">
          <img loading="lazy" decoding="async" src="src/assets/images/balnia/02.jpg" alt="" />
        </div>
        <div class="photo-item" style="flex: 0 0 21%">
          <img loading="lazy" decoding="async" src="src/assets/images/balnia/03.jpg" alt="" />
        </div>
      </div>

      <div class="series-row" style="justify-content: flex-end">
        <div class="photo-item" style="flex: 0 0 19%">
          <img loading="lazy" decoding="async" src="src/assets/images/balnia/04.jpg" alt="" />
        </div>
      </div>

    </section>

    <!-- ── MASTER POULET ─────────────────────── -->
    <section class="series" style="margin-top: -200px">

      <div class="series-row" style="justify-content: flex-start; padding-top: 120px">
        <div class="photo-item video-item" style="flex: 0 0 38%">
          <div class="video-wrap">
            <video autoplay muted loop playsinline>
              <source src="src/assets/videos/master_poulet.mp4" type="video/mp4" />
            </video>
            <button class="sound-btn" aria-label="Toggle sound">
              <svg class="icon-muted" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
              <svg class="icon-sound" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
            </button>
          </div>
          <p class="caption">Master Poulet — Classico / CAN - 2025</p>
        </div>
      </div>

    </section>

    <!-- ── BLABLA ─────────────────────────────── -->
    <section class="series">

      <div class="series-row" style="padding-left: 18%">
        <div class="photo-item" style="flex: 0 0 35%">
          <img loading="lazy" decoding="async" src="src/assets/images/divers/01.jpg" alt="" />
          <p class="caption">2025</p>
        </div>
      </div>

    </section>

    <!-- ── DIVERS ────────────────────────────── -->
    <section class="series">

      <div class="series-row" style="justify-content: flex-end">
      
        <div class="photo-item" style="flex: 0 0 19%">
          <img loading="lazy" decoding="async" src="src/assets/images/divers/03.jpg" alt="" />
        </div>
      </div>

    </section>

  </main>

  <div id="video-lightbox">
    <button class="lightbox-close" aria-label="Close">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
    </button>
    <video id="lightbox-video" controls playsinline></video>
  </div>

  <footer id="site-footer"></footer>

  <script src="src/scripts/main.js"></script>

</body>
</html>
