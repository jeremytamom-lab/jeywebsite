<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jeremy Tamom — Photographer</title>
  <link rel="apple-touch-icon" sizes="180x180" href="src/assets/images/favicon_io/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="src/assets/images/favicon_io/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="src/assets/images/favicon_io/favicon-16x16.png" />
  <link rel="manifest" href="src/assets/images/favicon_io/site.webmanifest" />
  <link rel="stylesheet" href="src/styles/main.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
</head>
<body>

  <header id="site-header"></header>

  <main class="gallery">

    <!-- ── OUVERTURE ────────────────────────── -->
    <section class="series">
      <div class="series-row" style="justify-content: center">
        <div class="photo-item" style="flex: 0 0 22%">
          <img src="src/assets/images/divers/02.jpg" alt="" />
          <p class="caption">2023</p>
        </div>
      </div>
    </section>

    <!-- ── WEYZ x FACE CACHÉE ───────────────── -->
    <section class="series">

      <div class="series-row">
        <div class="photo-item" style="flex: 1">
          <img src="src/assets/images/weyz/01.png" alt="" />
          <p class="caption">Weyz x Face Cachée Studio - 2025</p>
        </div>
        <div class="photo-item" style="flex: 1">
          <img src="src/assets/images/weyz/02.png" alt="" />
        </div>
        <div class="photo-item" style="flex: 1">
          <img src="src/assets/images/weyz/03.png" alt="" />
        </div>
        <div class="photo-item" style="flex: 1">
          <img src="src/assets/images/weyz/04.png" alt="" />
        </div>
      </div>

      <div class="series-row">
        <div class="photo-item" style="flex: 0 0 21%; margin-left: 52%">
          <img src="src/assets/images/weyz/05.png" alt="" />
        </div>
      </div>

    </section>

    <!-- ── BALNIA ────────────────────────────── -->
    <section class="series">

      <div class="series-row">
        <div class="photo-item" style="flex: 0 0 28%">
          <img src="src/assets/images/balnia/01.jpg" alt="" />
          <p class="caption">Balna - 2025</p>
        </div>
        <div class="photo-item" style="flex: 0 0 21%">
          <img src="src/assets/images/balnia/02.jpg" alt="" />
        </div>
        <div class="photo-item" style="flex: 0 0 21%">
          <img src="src/assets/images/balnia/03.jpg" alt="" />
        </div>
      </div>

      <div class="series-row" style="justify-content: flex-end">
        <div class="photo-item" style="flex: 0 0 24%">
          <img src="src/assets/images/balnia/04.jpg" alt="" />
        </div>
      </div>

    </section>

    <!-- ── BLABLA ─────────────────────────────── -->
    <section class="series">

      <div class="series-row" style="padding-left: 18%">
        <div class="photo-item" style="flex: 0 0 40%">
          <img src="src/assets/images/blabla/cover.png" alt="" />
          <p class="caption">Thien - Cover</p>
        </div>
      </div>

    </section>

    <!-- ── DIVERS ────────────────────────────── -->
    <section class="series">

      <div class="series-row" style="justify-content: flex-end">
        <div class="photo-item" style="flex: 0 0 19%">
          <img src="src/assets/images/divers/01.jpg" alt="" />
        </div>
        <div class="photo-item" style="flex: 0 0 19%">
          <img src="src/assets/images/divers/03.jpg" alt="" />
        </div>
      </div>

    </section>

  </main>

  <footer id="site-footer"></footer>

  <script src="src/scripts/main.js"></script>

</body>
</html>
