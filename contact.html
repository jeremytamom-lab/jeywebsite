<!DOCTYPE html>
<html lang="fr">
<head>

<body>

  <header>
    <a href="index.html" class="nav-logo">Jeremy Tamom</a>
    <a href="contact.html" class="nav-contact active">Contact</a>
  </header>

  <div class="contact-page">
    <div class="contact-wrap">
      <h1>Get in touch</h1>

      <div class="contact-info">
        <a href="mailto:jeremytamom@gmail.com">jeremytamom@gmail.com</a>
        <a href="https://www.instagram.com/j3eyyy/" target="_blank">@jeremytamom</a>

      <form class="contact-form" onsubmit="handleSubmit(event)">
        <input type="text" name="name" placeholder="Nom" required />
        <input type="email" name="email" placeholder="Email" required />
        <textarea name="message" placeholder="Message" required></textarea>
        <button type="submit">Envoyer</button>
      </form>
    </div>
  </div>

    <div class="footer-links">
      <a href="mailto:jeremytamom@gmail.com">EMAIL</a>

    </div>
  </footer>

  <script src="src/scripts/main.js"></script>



</body>
</html>
