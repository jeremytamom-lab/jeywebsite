<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Jeremy Tamom</title>
  <link rel="apple-touch-icon" sizes="180x180" href="src/assets/images/favicon_io/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="src/assets/images/favicon_io/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="src/assets/images/favicon_io/favicon-16x16.png" />
  <link rel="manifest" href="src/assets/images/favicon_io/site.webmanifest" />
  <link rel="stylesheet" href="src/styles/main.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
</head>
<body>

  <header id="site-header"></header>

  <div class="editorial-page">

    <div class="editorial-grid">

      <div class="editorial-col editorial-col--bio">
        <p class="editorial-body">
          Got a project in mind? Let's talk. I'm open to commissions, collaborations, and long-term partnerships.


        </p>
        <div class="editorial-links">
          <a href="mailto:jeremytamom@gmail.com">jeremytamom@gmail.com</a>
          <a href="https://www.instagram.com/j3eyyy/" target="_blank">@j3eyyy</a>
        </div>
      </div>

      <div class="editorial-col">
        <h2 class="editorial-section-title">Send a message</h2>
        <form class="editorial-form" onsubmit="handleSubmit(event)">
          <input type="text" name="name" placeholder="Name" required />
          <input type="email" name="email" placeholder="Email" required />
          <textarea name="message" placeholder="Message" required></textarea>
          <button type="submit">Send</button>
        </form>
      </div>

    </div>
  </div>

  <footer id="site-footer"></footer>

  <script src="src/scripts/main.js"></script>

</body>
</html>
